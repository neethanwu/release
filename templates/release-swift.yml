# Release workflow for Swift/macOS projects.
# Triggered when a version tag (v*) is pushed.
# Builds the project and creates a GitHub Release with the artifact.
# Generated by the /release skill. Adapt as needed.
#
# Placeholders (replaced during generation):
#   {{SWIFT_VERSION}}  — Swift version (e.g., "6.0", "5.10")
#   {{MACOS_VERSION}}  — macOS runner (e.g., "macos-15", "macos-14")
#   {{BUILD_CMD}}      — build command (e.g., "make release", "swift build -c release")
#   {{ARTIFACT_GLOB}}  — artifact pattern (e.g., "*.dmg", "*.zip")

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: {{MACOS_VERSION}}
    steps:
      - uses: actions/checkout@v4

      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "{{SWIFT_VERSION}}"

      - name: Build
        run: {{BUILD_CMD}}

      - name: Extract release notes
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -n "/## \[${VERSION}\]/,/## \[/p" CHANGELOG.md | sed '$d' > /tmp/release-notes.md
          echo "notes_file=/tmp/release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "${{ steps.notes.outputs.notes_file }}" \
            {{ARTIFACT_GLOB}}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
