# CI workflow for Swift/macOS projects.
# Generated by the /release skill. Adapt as needed.
#
# Placeholders (replaced during generation):
#   {{SWIFT_VERSION}} — Swift version (e.g., "6.0", "5.10")
#   {{MACOS_VERSION}} — macOS runner (e.g., "macos-15", "macos-14")

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  ci:
    runs-on: {{MACOS_VERSION}}
    steps:
      - uses: actions/checkout@v4

      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "{{SWIFT_VERSION}}"

      - run: swift build
        name: Build

      - run: swift test
        name: Test
